[package]
name = "winter-core"
version = "1.7.0"
edition = "2021"
build = "build.rs"

[features]
default = []
serde = ["dep:serde"]
all = ["serde"]

[lib]
path = "src/lib.rs"
crate-type = ["lib"]

[[example]]
name = "colorchanger-raw"
path = "examples/colorchanger-raw/bin.rs"

[[example]]
name = "window-raw"
path = "examples/window-raw/bin.rs"

[[example]]
name = "simple-raw"
path = "examples/simple-raw/bin.rs"

[[example]]
name = "key_callback-raw"
path = "examples/key_callback-raw/bin.rs"

[[example]]
name = "texture-raw"
path = "examples/texture-raw/bin.rs"


[dev-dependencies]
rand = {version = "0.8"}
once_cell = {version = "1.19"}
glfw ={ workspace = true}
image ={ version = "0.25"}

[dependencies]
num-integer ={ version = "0.1"}
num-traits = {version = "0.2"}
bytemuck = {workspace = true}
serde = {version = "1",optional = true,features = ["derive"]}

[build-dependencies]
gl_generator = { version = "0.14"}